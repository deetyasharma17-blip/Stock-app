<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sign Up / Login - Stock Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🔐 Sign In / Sign Up</h1>
<p class="login-info">Use sign up to create a new account with name and email, or log in with an existing email.</p>

<div class="login-panel">
  <div class="login-field">
    <input id="name" type="text" placeholder="Full name (sign up)">
  </div>
  <div class="login-field">
    <input id="email" type="email" placeholder="Email address">
  </div>
  <div class="login-field">
    <input id="password" type="password" placeholder="Password">
  </div>
  <div class="login-field">
    <input id="confirm-password" type="password" placeholder="Confirm password (sign up)">
  </div>
  <button id="login-button">Login</button>
  <button id="signup-button">Sign Up</button>
  <div id="login-error" class="error-message"></div>
  <div class="login-link">
    <a href="index.html">Go to Home</a>
  </div>
</div>

<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
